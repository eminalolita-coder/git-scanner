server:
    interface: 127.0.0.1
    port: 53
    access-control: 127.0.0.0/8 allow
    num-threads: 64

    # 41M distinct domains: the old 1g/2g caches filled up and unbound thrashed.
    # 8g/16g holds ~10M zones, we have 314 GB.
    msg-cache-size: 8g
    rrset-cache-size: 16g
    cache-max-ttl: 7200
    cache-min-ttl: 300
    prefetch: yes

    # Answer from stale cache instead of blocking on a refresh.
    serve-expired: yes
    serve-expired-ttl: 3600
    serve-expired-reply-ttl: 30

    # THE fix for "failed to find an open port, drop msg": outgoing-range is PER
    # THREAD in unbound. 8192 total over 64 threads = 128 concurrent upstream
    # queries per thread, which froze the whole scan at ~1.1M hosts (workers
    # stuck in DNS, 0 CPU, 0 sockets, whatever the concurrency).
    outgoing-range: 8192
    num-queries-per-thread: 4096

    so-reuseport: yes
    so-rcvbuf: 16m
    so-sndbuf: 16m
    jostle-timeout: 200
    infra-cache-numhosts: 1000000
    infra-host-ttl: 900

    # No IPv6 on this list: saves one upstream query per host.
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    verbosity: 1
    do-daemonize: yes
    hide-identity: yes
    hide-version: yes

# Always forward: full recursion measured ~168 req/s on this box, forwarding to
# a public upstream ~690 req/s with three upstreams it is a few thousand.
# forward-first: yes made unbound try recursion FIRST (the slow path).
forward-zone:
    name: "."
    forward-addr: 8.8.8.8
    forward-addr: 8.8.4.4
    forward-addr: 9.9.9.9
    forward-first: no
